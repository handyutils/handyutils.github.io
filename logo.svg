<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="HandyUtils — crossed wrench and screwdriver on a dark roundel">
  <defs>
    <radialGradient id="ground" cx="36%" cy="28%" r="82%">
      <stop offset="0" stop-color="#2c2c25"/>
      <stop offset="0.5" stop-color="#16160f"/>
      <stop offset="1" stop-color="#070705"/>
    </radialGradient>
    <linearGradient id="neon" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f2ff92"/>
      <stop offset="0.42" stop-color="#cdf53a"/>
      <stop offset="1" stop-color="#a5d416"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <filter id="soften" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>

    <!-- wrench: head at top, handle downward -->
    <g id="wrench">
      <rect x="53.5" y="41" width="13" height="57" rx="6.5"/>
      <circle cx="60" cy="30" r="13.5" fill="none" stroke-width="11" stroke-dasharray="62 23"/>
    </g>

    <!-- screwdriver: handle at top, blade downward -->
    <g id="screwdriver">
      <rect x="52" y="17" width="16" height="32" rx="8"/>
      <rect x="57" y="48" width="6" height="6" rx="1.6"/>
      <rect x="57.5" y="53" width="5" height="35"/>
      <rect x="55.5" y="87.5" width="9" height="8" rx="1.4"/>
    </g>
  </defs>

  <circle cx="60" cy="60" r="59" fill="url(#ground)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#75755f" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="#cdf53a" stroke-opacity="0.16" stroke-width="1"/>

  <g filter="url(#soften)" opacity="0.9" fill="#8f3a17" stroke="#8f3a17">
    <g transform="translate(1.9,2.1)">
      <g transform="rotate(-45 60 60)"><use href="#screwdriver"/></g>
      <g transform="rotate(45 60 60)"><use href="#wrench"/></g>
    </g>
  </g>

  <g fill="url(#neon)" stroke="url(#neon)">
    <g transform="rotate(-45 60 60)"><use href="#screwdriver"/></g>
    <g transform="rotate(45 60 60)"><use href="#wrench"/></g>
  </g>

  <circle cx="60" cy="60" r="59" fill="#000000" filter="url(#grain)" opacity="0.10"/>
  <circle cx="60" cy="60" r="59" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="2"/>
</svg>